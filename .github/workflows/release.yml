name: Release

# Push a tag such as v2.1.0: the plugin zip and its update.json manifest are
# built and attached to a GitHub release, whose notes are the changelog entry
# of README.txt. Sites running the plugin see the
# update within twelve hours, and install it on their own where auto-updates
# are on.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Check the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header="$(sed -n 's/^ \* Version: *//p' cinq-wp-mcp.php)"
          if [ "$tag" != "$header" ]; then
            echo "Tag $tag, header $header: bump Version in cinq-wp-mcp.php." >&2
            exit 1
          fi

      - name: Read the changelog entry
        run: |
          awk -v heading="= ${GITHUB_REF_NAME#v} =" '$0 == heading { found = 1; next } found && /^=/ { exit } found' README.txt > notes.md
          if ! grep -q . notes.md; then
            echo "No changelog entry for ${GITHUB_REF_NAME#v} in README.txt." >&2
            exit 1
          fi
          cat notes.md

      - run: composer install --no-interaction --no-progress && composer test

      - name: Build the zip
        run: |
          mkdir -p build
          git archive --format=tar --prefix=cinq-wp-mcp/ HEAD | tar -x -C build
          (cd build && zip -qr ../cinq-wp-mcp.zip cinq-wp-mcp)
          unzip -l cinq-wp-mcp.zip | tail -n 5

      # Read by the plugin's updater: a plain download, not rate-limited like
      # GitHub's API. The readme fills the "View details" modal.
      - name: Write the update manifest
        run: |
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --arg package "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/cinq-wp-mcp.zip" \
            --arg requires "$(sed -n 's/^ \* Requires at least: *//p' cinq-wp-mcp.php)" \
            --arg requires_php "$(sed -n 's/^ \* Requires PHP: *//p' cinq-wp-mcp.php)" \
            --arg last_updated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile readme README.txt \
            '{version: $version, url: $url, package: $package, requires: $requires, requires_php: $requires_php, last_updated: $last_updated, readme: $readme}' > update.json
          jq 'del(.readme)' update.json

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            cinq-wp-mcp.zip
            update.json
          body_path: notes.md
